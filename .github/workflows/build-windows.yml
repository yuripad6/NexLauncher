name: Build NexLauncher for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "electron/**"
      - "vite.config.js"
      - "tailwind.config.js"
      - "index.html"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexLauncher-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
